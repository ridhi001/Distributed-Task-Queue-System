spring.application.name=orchestrator
server.port=8080

# H2 Database Configurations
spring.datasource.url=jdbc:h2:file:./data/jobsdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# H2 Console (Secured: remote access disabled by default)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=false

# CORS Security (Configurable origin list)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080}

# API Key Security Filter
app.security.api-key=${APP_API_KEY:dev-secret-api-key}
app.security.api-key-enabled=${APP_API_KEY_ENABLED:true}

# Rate Limiting (AI Router quota protection)
app.rate-limit.ai-route.requests-per-minute=${AI_ROUTE_RPM:10}

# Gemini Configuration
gemini.api.key=${GEMINI_API_KEY:}
