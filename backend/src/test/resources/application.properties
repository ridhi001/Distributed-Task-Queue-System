spring.application.name=orchestrator-test

# In-memory H2 database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Test security settings
app.security.api-key=dev-secret-api-key
app.security.api-key-enabled=true
app.cors.allowed-origins=http://localhost:3000,http://localhost:8080
app.rate-limit.ai-route.requests-per-minute=10
